[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Vite fingerprints everything under /assets with a content hash, so a given
# filename's contents never change — safe to cache for a year and skip
# revalidation entirely. Without this, Netlify's default (max-age=0,
# must-revalidate) forces a conditional request for every asset on every visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
